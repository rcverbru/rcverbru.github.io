name: Update Strava Activities

on:
  schedule:
    - cron: '0 16 * * *'  # daily at 12:00 Eastern (EDT, UTC-4)
    - cron: '0 4 * * *'  # daily at 00:00 Eastern (EDT, UTC-4)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fetch recent Strava activities
      env:
        STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
        STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
        STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      run: node scripts/fetch-strava.js

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add _data/strava_activities.json _data/strava_gear.json
        git commit -m "Update recent Strava activities" || echo "No changes to commit"
        git push
